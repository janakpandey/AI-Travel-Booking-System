# Render Blueprint — deploys both services + PostgreSQL
# Push this repo to GitHub and connect at https://dashboard.render.com/blueprints

databases:
  - name: aeroplanner-db
    databaseName: langgraph
    user: aeroplanner
    plan: free
    ipAllowList: [] # allow all connections (required for free tier)
    region: oregon

services:
  # ── FastAPI Backend ────────────────────────────────────────────────
  - type: web
    name: aeroplanner-api
    runtime: python
    repo: https://github.com/yourusername/Travel_Multi_Agent
    branch: main
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false # set manually in Render dashboard
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aeroplanner-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

  # ── Next.js Frontend ──────────────────────────────────────────────
  - type: web
    name: aeroplanner-ui
    runtime: node
    repo: https://github.com/yourusername/Travel_Multi_Agent
    branch: main
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aeroplanner-api
          property: hostname # e.g. https://aeroplanner-api.onrender.com
