services:
  - type: web
    name: aeroplanner
    runtime: node
    repo: https://github.com/yourusername/aeroplanner
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://aeroplanner.onrender.com
